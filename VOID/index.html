<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikram Kuralbaev | Digital Space</title>
    <!-- FontAwesome Ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #05050a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* Neon Nur Animatsiyalari */
        .glow-1, .glow-2 {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
            animation: pulse 6s infinite alternate ease-in-out;
        }

        .glow-1 {
            background: #7928ca;
            top: 15%;
            left: 20%;
        }

        .glow-2 {
            background: #ff0080;
            bottom: 15%;
            right: 20%;
            animation-delay: -3s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -20px); }
        }

        /* Karta Konteyneri */
        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card-container:hover {
            border-color: rgba(255, 0, 128, 0.4);
            transform: translateY(-8px);
        }

        /* Profil Logotipi */
        .profile-badge {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7928ca, #ff0080);
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.5);
        }

        .profile-badge-inner {
            width: 100%;
            height: 100%;
            background: #05050a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #ff0080;
        }

        /* Ism va Lavozim */
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 0, 128, 0.1);
            border: 1px solid rgba(255, 0, 128, 0.3);
            border-radius: 20px;
            color: #ff4da6;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Grid Bo'limi (Xususiyatlar) */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 16px;
            transition: background 0.3s ease;
        }

        .feature-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .feature-card i {
            font-size: 20px;
            color: #7928ca;
            margin-bottom: 8px;
            display: block;
        }

        .feature-card span {
            font-size: 12px;
            color: #a1a1aa;
            font-weight: 600;
        }

        /* Tugmalar */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-main {
            background: linear-gradient(135deg, #7928ca, #ff0080);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(121, 40, 202, 0.4);
        }

        .btn-main:hover {
            box-shadow: 0 15px 35px rgba(255, 0, 128, 0.6);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }

        /* Telefonlar uchun optimizatsiya */
        @media (max-width: 480px) {
            .card-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- Fon uchun Neon Doiralar -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- Asosiy Karta -->
    <div class="card-container">
        
        <div class="profile-badge">
            <div class="profile-badge-inner">
                <i class="fa-solid fa-terminal"></i>
            </div>
        </div>

        <h1>Ikram Kuralbaev</h1>
        <div class="tag">SOFTWARE DEVELOPER</div>

        <div class="features-grid">
            <div class="feature-card">
                <i class="fa-solid fa-bolt-lightning"></i>
                <span>Tezkor</span>
            </div>
            <div class="feature-card">
                <i class="fa-solid fa-code"></i>
                <span>To'za Kod</span>
            </div>
            <div class="feature-card">
                <i class="fa-solid fa-layer-group"></i>
                <span>Zamonaviy</span>
            </div>
        </div>

        <div class="action-buttons">
            <a href="https://github.com/ikramkuralbaev2-ctrl" target="_blank" class="btn btn-main">
                <i class="fa-brands fa-github"></i> GitHub Profilim
            </a>
            <a href="#" class="btn btn-secondary">
                <i class="fa-solid fa-paper-plane"></i> Bog'lanish
            </a>
        </div>

    </div>

</body>
</html>
